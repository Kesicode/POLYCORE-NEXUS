name: polycore-nexus

# PolyCore Nexus — Full-stack polyglot engineering platform
# Run with: docker compose up --build

services:

  # ─── Infrastructure ──────────────────────────────────────────────────────────

  postgres:
    image: postgres:16-alpine
    container_name: polycore-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-polycore_nexus}
      POSTGRES_USER: ${POSTGRES_USER:-polycore}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-polycore_secret}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./database/migrations:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-polycore} -d ${POSTGRES_DB:-polycore_nexus}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - polycore-backend

  redis:
    image: redis:7-alpine
    container_name: polycore-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - polycore-backend

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: polycore-mqtt
    restart: unless-stopped
    volumes:
      - ./infrastructure/docker/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto-data:/mosquitto/data
      - mosquitto-logs:/mosquitto/log
    ports:
      - "1883:1883"   # MQTT
      - "9001:9001"   # MQTT over WebSocket
    networks:
      - polycore-backend
      - polycore-frontend

  # ─── Application Services ─────────────────────────────────────────────────────

  api-gateway:
    build:
      context: ./services/api-gateway
      dockerfile: Dockerfile
    container_name: polycore-api-gateway
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-polycore}:${POSTGRES_PASSWORD:-polycore_secret}@postgres:5432/${POSTGRES_DB:-polycore_nexus}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-change_me_to_a_long_random_secret_for_production}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      API_GATEWAY_PORT: "8080"
      AI_SERVICE_URL: http://ai-service:8001
      EXECUTION_SERVICE_URL: http://execution-service:8002
      JAVA_SERVICE_URL: http://java-service:8003
      IOT_SERVICE_URL: http://iot-service:8005
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - polycore-backend
      - polycore-frontend

  ai-service:
    build:
      context: ./services/ai-service
      dockerfile: Dockerfile
    container_name: polycore-ai-service
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-polycore}:${POSTGRES_PASSWORD:-polycore_secret}@postgres:5432/${POSTGRES_DB:-polycore_nexus}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-change_me_to_a_long_random_secret_for_production}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      PORT: "8001"
      ENVIRONMENT: ${ENVIRONMENT:-development}
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - polycore-backend

  execution-service:
    build:
      context: ./services/execution-service
      dockerfile: Dockerfile
    container_name: polycore-execution-service
    restart: unless-stopped
    user: root
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-polycore}:${POSTGRES_PASSWORD:-polycore_secret}@postgres:5432/${POSTGRES_DB:-polycore_nexus}
      REDIS_URL: redis://redis:6379
      EXECUTION_SERVICE_PORT: "8002"
      MAX_CONCURRENT_EXECUTIONS: ${MAX_CONCURRENT_EXECUTIONS:-5}
      EXECUTION_DEFAULT_TIMEOUT_SECS: ${EXECUTION_DEFAULT_TIMEOUT_SECS:-10}
      EXECUTION_MAX_TIMEOUT_SECS: ${EXECUTION_MAX_TIMEOUT_SECS:-30}
      EXECUTION_MAX_MEMORY_MB: ${EXECUTION_MAX_MEMORY_MB:-128}
      EXECUTION_MAX_OUTPUT_KB: ${EXECUTION_MAX_OUTPUT_KB:-1024}
    volumes:
      # Mount Docker socket so execution service can create containers
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "8002:8002"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 25s
    networks:
      - polycore-backend

  iot-service:
    build:
      context: ./services/iot-service
      dockerfile: Dockerfile
    container_name: polycore-iot-service
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-polycore}:${POSTGRES_PASSWORD:-polycore_secret}@postgres:5432/${POSTGRES_DB:-polycore_nexus}
      REDIS_URL: redis://redis:6379
      MQTT_BROKER_URL: mqtt://mosquitto:1883
      IOT_SERVICE_PORT: "8005"
      JWT_SECRET: ${JWT_SECRET:-change_me_to_a_long_random_secret_for_production}
    ports:
      - "8005:8005"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mosquitto:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8005/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - polycore-backend
      - polycore-frontend

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:8080
        VITE_WS_URL: ws://localhost:8080
    container_name: polycore-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      api-gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - polycore-frontend

  # ─── Monitoring (optional) ───────────────────────────────────────────────────

  prometheus:
    image: prom/prometheus:latest
    container_name: polycore-prometheus
    restart: unless-stopped
    volumes:
      - ./infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
    ports:
      - "9090:9090"
    profiles:
      - monitoring
    networks:
      - polycore-backend

  grafana:
    image: grafana/grafana:latest
    container_name: polycore-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./infrastructure/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
    profiles:
      - monitoring
    networks:
      - polycore-backend

# ─── Networks ────────────────────────────────────────────────────────────────

networks:
  polycore-backend:
    driver: bridge
    internal: false
  polycore-frontend:
    driver: bridge

# ─── Volumes ─────────────────────────────────────────────────────────────────

volumes:
  postgres-data:
  redis-data:
  mosquitto-data:
  mosquitto-logs:
  prometheus-data:
  grafana-data:
