global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'api-gateway'
    static_configs:
      - targets: ['api-gateway:8080']
    metrics_path: '/metrics'

  - job_name: 'ai-service'
    static_configs:
      - targets: ['ai-service:8001']
    metrics_path: '/metrics'

  - job_name: 'execution-service'
    static_configs:
      - targets: ['execution-service:8002']
    metrics_path: '/metrics'

  - job_name: 'iot-service'
    static_configs:
      - targets: ['iot-service:8005']
    metrics_path: '/metrics'

  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres:5432']
