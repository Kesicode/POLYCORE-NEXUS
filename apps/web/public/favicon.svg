<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Hexagon background -->
  <polygon points="32,2 58,17 58,47 32,62 6,47 6,17" fill="#6366f1" opacity="0.9"/>
  <!-- "P" shape with connected nodes -->
  <circle cx="20" cy="20" r="3" fill="white"/>
  <circle cx="20" cy="32" r="3" fill="white"/>
  <circle cx="20" cy="44" r="3" fill="white"/>
  <circle cx="32" cy="20" r="3" fill="white"/>
  <circle cx="38" cy="26" r="3" fill="#a5b4fc"/>
  <circle cx="32" cy="32" r="3" fill="white"/>
  <!-- Connections -->
  <line x1="20" y1="20" x2="20" y2="44" stroke="white" stroke-width="2" opacity="0.6"/>
  <line x1="20" y1="20" x2="32" y2="20" stroke="white" stroke-width="2" opacity="0.6"/>
  <line x1="32" y1="20" x2="38" y2="26" stroke="white" stroke-width="2" opacity="0.6"/>
  <line x1="38" y1="26" x2="32" y2="32" stroke="white" stroke-width="2" opacity="0.6"/>
  <line x1="32" y1="32" x2="20" y2="32" stroke="white" stroke-width="2" opacity="0.6"/>
  <!-- Outer glow nodes -->
  <circle cx="46" cy="36" r="2.5" fill="#34d399" opacity="0.8"/>
  <circle cx="44" cy="46" r="2" fill="#f59e0b" opacity="0.8"/>
  <line x1="38" y1="26" x2="46" y2="36" stroke="#a5b4fc" stroke-width="1.5" opacity="0.5"/>
  <line x1="46" y1="36" x2="44" y2="46" stroke="#a5b4fc" stroke-width="1.5" opacity="0.5"/>
</svg>
